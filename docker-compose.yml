services:
  service-mcp-gateway:
    build: .
    container_name: service-mcp-gateway
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: [.env]
    environment:
      NODE_ENV: production
      RUNTIME_PROFILE: production
      LISTEN_HOST: 0.0.0.0
      MCP_AUTH_MODE: oauth
      PUBLISHING_JOURNAL_DIRECTORY: /var/lib/ngx-publishing
      AUTH_INTROSPECTION_SECRET_FILE: /run/secrets/introspection
    volumes:
      - publisher-runs:/var/lib/ngx-publishing
      - type: bind
        source: ${INTROSPECTION_SECRET_HOST_FILE:?Set persistent owner-only secret path}
        target: /run/secrets/introspection
        read_only: true

    networks: [ngx-net]
networks:
  ngx-net:
    external: true

volumes:
  publisher-runs:
