name: Validate and explicitly publish release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated package version through trusted OIDC
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install and validate gateway and contracts
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test -- --runInBand
          npm run test:e2e -- --runInBand
          npm run lint:check
          npm --prefix contracts/service-mcp-gateway ci
          npm run contracts:service-mcp-gateway:gen
          npm run contracts:service-mcp-gateway:build
          git diff --exit-code -- openapi.json mcp-tools.json contracts/service-mcp-gateway/src contracts/service-mcp-gateway/dist
      - name: Build immutable candidate locally (never push)
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag service-mcp-gateway:candidate .
          docker image inspect service-mcp-gateway:candidate --format '{{.Id}}' > image-id.txt
          docker run --rm --entrypoint node service-mcp-gateway:candidate -e 'if(process.getuid() !== 1000) process.exit(1); require("fs").accessSync("dist/main.js"); require("@tmdjr/ngx-auth-client")'
          docker run --rm --entrypoint sh service-mcp-gateway:candidate -c 'test ! -e /usr/src/app/.oauth-local && test ! -e /usr/src/app/.env && test ! -e /usr/src/app/secrets'
          docker save service-mcp-gateway:candidate > image.tar
          sha256sum image.tar > image.tar.sha256
      - name: Retain candidate for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: service-mcp-gateway-candidate-${{ github.sha }}
          path: |
            image.tar
            image.tar.sha256
            image-id.txt
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Build the committed release
        run: |
          npm install --global npm@12.1.0
          npm ci
          npm run build
          npm --prefix contracts/service-mcp-gateway ci
          npm run contracts:service-mcp-gateway:gen
          npm run contracts:service-mcp-gateway:build
      - name: Publish through trusted OIDC
        working-directory: contracts/service-mcp-gateway
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm publish --access public --provenance
